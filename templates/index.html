<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Pseudocode Tutor</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🤖 AI Pseudocode Tutor</h1>
            <p>Learn Cambridge 9618 Pseudocode with AI</p>
            <p class="creator">Created by Tooba Shoaib</p>
        </div>

        <div class="tutor-card">

            <div class="input-area">

                <input
                    type="text"
                    id="question"
                    placeholder="Ask a Cambridge 9618 pseudocode question..."
                >

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    capture="environment"
                    hidden
                >

                <button onclick="document.getElementById('imageInput').click()">
                    📷
                </button>

                <button onclick="askQuestion()">
                    ➤ Send
                </button>

            </div>

            <div id="answer"></div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/script.js"></script>

</body>

</html>
